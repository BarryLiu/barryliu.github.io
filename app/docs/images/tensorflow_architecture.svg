<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="820" viewBox="0 0 1300 820" role="img" aria-labelledby="title desc">
  <title id="title">TensorFlow 架构图</title>
  <desc id="desc">展示 TensorFlow 2.x 从数据输入、Tensor 和 Eager Execution、Keras 模型、训练 API、GradientTape 到 SavedModel 与 Serving 部署的关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fffaf2"/>
      <stop offset="100%" stop-color="#f2fbff"/>
    </linearGradient>
    <linearGradient id="core" x1="0" x2="1">
      <stop offset="0%" stop-color="#fff3df"/>
      <stop offset="100%" stop-color="#ffe0ad"/>
    </linearGradient>
    <linearGradient id="keras" x1="0" x2="1">
      <stop offset="0%" stop-color="#eaf7ff"/>
      <stop offset="100%" stop-color="#d5ecff"/>
    </linearGradient>
    <linearGradient id="serve" x1="0" x2="1">
      <stop offset="0%" stop-color="#eefdf5"/>
      <stop offset="100%" stop-color="#d8f7e7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 40px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .sub { font: 400 18px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #475569; }
      .section { font: 700 24px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .box-title { font: 700 19px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #172033; }
      .text { font: 400 15px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #43536a; }
      .code { font: 600 14px "SFMono-Regular", Consolas, monospace; fill: #b45309; }
      .card { stroke: #d5dee9; stroke-width: 1.4; rx: 16; filter: url(#shadow); }
      .small { stroke: #d5dee9; stroke-width: 1.2; rx: 12; }
      .line { fill: none; stroke: #475569; stroke-width: 2.2; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 2.1; stroke-dasharray: 7 7; marker-end: url(#arrow); }
      .label { font: 600 13px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="1300" height="820" fill="url(#bg)"/>
  <text x="64" y="72" class="title">TensorFlow 架构图</text>
  <text x="64" y="108" class="sub">以 TensorFlow 2.x、Eager Execution 和 Keras 为主线，兼顾训练与生产部署</text>
  <rect x="50" y="140" width="1200" height="610" rx="26" fill="#ffffff" opacity="0.84" stroke="#dbe5ef"/>

  <rect x="92" y="190" width="255" height="160" class="card" fill="#f8fafc"/>
  <text x="122" y="232" class="section">数据输入</text>
  <text x="122" y="268" class="text">NumPy、CSV、图片、文本</text>
  <text x="122" y="296" class="text">tf.data.Dataset</text>
  <text x="122" y="324" class="text">batch、map、prefetch</text>

  <rect x="430" y="170" width="440" height="210" class="card" fill="url(#core)"/>
  <text x="462" y="214" class="section">TensorFlow 运行时</text>
  <text x="462" y="250" class="text">Tensor 是基本数据结构，2.x 默认即时执行</text>
  <rect x="462" y="278" width="170" height="66" class="small" fill="#ffffff"/>
  <text x="496" y="307" class="box-title">Tensor</text>
  <text x="496" y="331" class="text">CPU / GPU 计算</text>
  <rect x="665" y="278" width="170" height="66" class="small" fill="#ffffff"/>
  <text x="690" y="307" class="box-title">GradientTape</text>
  <text x="690" y="331" class="text">自动微分</text>

  <rect x="955" y="190" width="255" height="160" class="card" fill="url(#keras)"/>
  <text x="985" y="232" class="section">Keras 建模层</text>
  <text x="985" y="268" class="text">Sequential / Functional API</text>
  <text x="985" y="296" class="text">layers、Model、Callbacks</text>
  <text x="985" y="324" class="text">compile() 与 fit()</text>

  <rect x="92" y="455" width="520" height="185" class="card" fill="#fffaf0"/>
  <text x="122" y="498" class="section">训练方式</text>
  <text x="122" y="532" class="text">高层 API：model.compile()、model.fit()</text>
  <text x="122" y="561" class="text">自定义训练：with tf.GradientTape()</text>
  <text x="122" y="590" class="text">回调：EarlyStopping、Checkpoint、TensorBoard</text>
  <text x="122" y="620" class="code">model.fit(x_train, y_train, epochs=10)</text>

  <rect x="690" y="455" width="520" height="185" class="card" fill="url(#serve)"/>
  <text x="720" y="498" class="section">保存与部署</text>
  <text x="720" y="532" class="text">SavedModel 保存完整计算图与权重</text>
  <text x="720" y="561" class="text">TensorFlow Serving 支持生产服务化</text>
  <text x="720" y="590" class="text">可扩展到 Lite、JS 或企业部署场景</text>
  <text x="720" y="620" class="code">model.save("saved_model")</text>

  <rect x="92" y="674" width="1118" height="48" rx="14" fill="#f8fafc" stroke="#d5dee9"/>
  <text x="122" y="705" class="code">适用场景：模型训练、企业生产部署、TensorFlow Serving；大模型应用开发通常只需 NumPy + API 调用。</text>

  <path d="M 347 270 C 378 270, 398 270, 426 270" class="line"/>
  <path d="M 870 270 C 900 270, 925 270, 950 270" class="line"/>
  <path d="M 1083 350 C 1083 410, 380 410, 352 455" class="line"/>
  <path d="M 612 548 C 640 548, 660 548, 686 548" class="line"/>
  <path d="M 750 455 C 750 420, 750 392, 750 346" class="dash"/>
  <path d="M 1030 455 C 1050 415, 1110 392, 1110 350" class="dash"/>
  <text x="370" y="250" class="label">构建 Dataset</text>
  <text x="890" y="250" class="label">定义模型</text>
  <text x="632" y="532" class="label">训练完成</text>
  <text x="760" y="414" class="label">梯度更新</text>
  <text x="1064" y="410" class="label">导出模型</text>
</svg>
