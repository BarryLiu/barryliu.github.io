<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">LangChain 架构图</title>
  <desc id="desc">展示 LangChain 应用从用户输入到编排、模型调用、RAG 检索、Agent 工具调用、Memory 与观测层的关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef6f4"/>
    </linearGradient>
    <linearGradient id="app" x1="0" x2="1">
      <stop offset="0%" stop-color="#e8f3ff"/>
      <stop offset="100%" stop-color="#d8ecff"/>
    </linearGradient>
    <linearGradient id="core" x1="0" x2="1">
      <stop offset="0%" stop-color="#e8fff4"/>
      <stop offset="100%" stop-color="#d6f7e5"/>
    </linearGradient>
    <linearGradient id="model" x1="0" x2="1">
      <stop offset="0%" stop-color="#fff7e8"/>
      <stop offset="100%" stop-color="#ffe8bd"/>
    </linearGradient>
    <linearGradient id="data" x1="0" x2="1">
      <stop offset="0%" stop-color="#f2edff"/>
      <stop offset="100%" stop-color="#e2d8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .page-title { font: 700 40px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #475569; }
      .section-title { font: 700 24px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .box-title { font: 700 19px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #172033; }
      .box-text { font: 400 15px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #42526b; }
      .badge { font: 700 14px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f766e; }
      .card { stroke: #d5dee9; stroke-width: 1.5; rx: 14; filter: url(#shadow); }
      .small-card { stroke: #d5dee9; stroke-width: 1.2; rx: 12; }
      .line { fill: none; stroke: #475569; stroke-width: 2.2; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrow); }
      .label { font: 600 13px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>
  <text x="70" y="76" class="page-title">LangChain 架构图</text>
  <text x="70" y="112" class="subtitle">从业务入口到 LCEL 编排、模型调用、RAG 检索、Agent 工具执行与运行观测的核心关系</text>

  <rect x="55" y="145" width="1290" height="680" rx="26" fill="#ffffff" opacity="0.82" stroke="#dbe5ef"/>

  <!-- Application layer -->
  <rect x="95" y="190" width="255" height="165" class="card" fill="url(#app)"/>
  <text x="123" y="232" class="section-title">应用入口</text>
  <text x="123" y="268" class="box-text">Web / CLI / API 服务</text>
  <text x="123" y="296" class="box-text">用户问题、业务上下文</text>
  <text x="123" y="324" class="box-text">权限、会话、配置</text>

  <!-- LangChain orchestration -->
  <rect x="430" y="170" width="440" height="230" class="card" fill="url(#core)"/>
  <text x="462" y="214" class="section-title">LangChain 编排层</text>
  <text x="462" y="248" class="box-text">LCEL / Runnable / Chain 负责把步骤组合成流程</text>

  <rect x="462" y="275" width="175" height="82" class="small-card" fill="#ffffff"/>
  <text x="486" y="308" class="box-title">Prompt</text>
  <text x="486" y="334" class="box-text">模板与变量注入</text>

  <rect x="665" y="275" width="175" height="82" class="small-card" fill="#ffffff"/>
  <text x="690" y="308" class="box-title">Output Parser</text>
  <text x="690" y="334" class="box-text">结构化输出解析</text>

  <!-- Model layer -->
  <rect x="960" y="190" width="300" height="165" class="card" fill="url(#model)"/>
  <text x="992" y="232" class="section-title">模型与 Embedding</text>
  <text x="992" y="268" class="box-text">ChatModel / LLM</text>
  <text x="992" y="296" class="box-text">Embedding Model</text>
  <text x="992" y="324" class="box-text">如 Qwen、OpenAI、DashScope</text>

  <!-- RAG data layer -->
  <rect x="95" y="465" width="520" height="255" class="card" fill="url(#data)"/>
  <text x="126" y="509" class="section-title">RAG 数据与检索</text>
  <text x="126" y="543" class="box-text">把外部知识转换为可检索上下文，再交给编排层使用</text>

  <rect x="126" y="575" width="132" height="84" class="small-card" fill="#ffffff"/>
  <text x="148" y="608" class="box-title">Loader</text>
  <text x="148" y="634" class="box-text">文档加载</text>

  <rect x="283" y="575" width="132" height="84" class="small-card" fill="#ffffff"/>
  <text x="304" y="608" class="box-title">Splitter</text>
  <text x="304" y="634" class="box-text">文本切分</text>

  <rect x="440" y="575" width="132" height="84" class="small-card" fill="#ffffff"/>
  <text x="462" y="608" class="box-title">Vector DB</text>
  <text x="462" y="634" class="box-text">向量存储</text>

  <text x="126" y="692" class="badge">Retriever 返回相关片段，组成上下文注入 Prompt</text>

  <!-- Agent and tools -->
  <rect x="705" y="465" width="555" height="255" class="card" fill="#f7fbff"/>
  <text x="737" y="509" class="section-title">Agent 与工具调用</text>
  <text x="737" y="543" class="box-text">模型根据任务规划下一步，选择工具执行，再把结果带回推理循环</text>

  <rect x="737" y="575" width="150" height="84" class="small-card" fill="#ffffff"/>
  <text x="762" y="608" class="box-title">Agent</text>
  <text x="762" y="634" class="box-text">计划与决策</text>

  <rect x="923" y="575" width="150" height="84" class="small-card" fill="#ffffff"/>
  <text x="946" y="608" class="box-title">Tools</text>
  <text x="946" y="634" class="box-text">搜索 / DB / API</text>

  <rect x="1100" y="575" width="130" height="84" class="small-card" fill="#ffffff"/>
  <text x="1124" y="608" class="box-title">Result</text>
  <text x="1124" y="634" class="box-text">执行结果</text>

  <text x="737" y="692" class="badge">适合复杂任务、函数调用、多步骤自动化</text>

  <!-- Cross-cutting components -->
  <rect x="430" y="742" width="830" height="52" rx="16" fill="#f8fafc" stroke="#d5dee9"/>
  <text x="462" y="775" class="box-title">横切能力：Memory 会话状态 · Callbacks 回调 · LangSmith / 日志 / Trace 观测</text>

  <!-- Flow arrows -->
  <path d="M 350 272 C 380 272, 395 272, 425 272" class="line"/>
  <path d="M 870 272 C 900 272, 925 272, 955 272" class="line"/>
  <path d="M 1110 355 C 1110 420, 680 420, 650 400" class="dashed"/>
  <path d="M 615 594 C 650 594, 660 455, 650 402" class="line"/>
  <path d="M 870 330 C 908 410, 748 432, 812 465" class="line"/>
  <path d="M 887 617 C 905 617, 906 617, 920 617" class="line"/>
  <path d="M 1073 617 C 1085 617, 1088 617, 1098 617" class="line"/>
  <path d="M 1165 575 C 1188 510, 1095 420, 760 400" class="dashed"/>
  <path d="M 845 742 C 845 715, 845 710, 845 720" class="dashed"/>

  <text x="374" y="252" class="label">请求</text>
  <text x="895" y="252" class="label">调用</text>
  <text x="1014" y="415" class="label">模型响应</text>
  <text x="620" y="488" class="label">检索上下文</text>
  <text x="802" y="440" class="label">任务规划</text>
</svg>
