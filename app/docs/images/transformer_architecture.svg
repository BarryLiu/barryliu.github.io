<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Transformer 架构图</title>
  <desc id="desc">展示 Transformer 的输入嵌入、位置编码、Encoder、Decoder、注意力模块、前馈网络以及输出层。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef7ff"/>
    </linearGradient>
    <linearGradient id="embed" x1="0" x2="1">
      <stop offset="0%" stop-color="#e8f3ff"/>
      <stop offset="100%" stop-color="#d8ecff"/>
    </linearGradient>
    <linearGradient id="encoder" x1="0" x2="1">
      <stop offset="0%" stop-color="#e8fff4"/>
      <stop offset="100%" stop-color="#d6f7e5"/>
    </linearGradient>
    <linearGradient id="decoder" x1="0" x2="1">
      <stop offset="0%" stop-color="#fff7e8"/>
      <stop offset="100%" stop-color="#ffe8bd"/>
    </linearGradient>
    <linearGradient id="output" x1="0" x2="1">
      <stop offset="0%" stop-color="#f2edff"/>
      <stop offset="100%" stop-color="#e2d8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 40px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .sub { font: 400 18px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #475569; }
      .section { font: 700 24px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .box-title { font: 700 18px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #172033; }
      .text { font: 400 15px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #42526b; }
      .small { font: 400 13px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #526177; }
      .code { font: 600 13px "SFMono-Regular", Consolas, monospace; fill: #0f766e; }
      .card { stroke: #d5dee9; stroke-width: 1.5; rx: 16; filter: url(#shadow); }
      .block { stroke: #d5dee9; stroke-width: 1.2; rx: 12; }
      .line { fill: none; stroke: #475569; stroke-width: 2.2; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrow); }
      .label { font: 600 13px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #64748b; }
      .center { text-anchor: middle; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>
  <text x="70" y="76" class="title">Transformer 架构图</text>
  <text x="70" y="112" class="sub">基于注意力机制的序列建模结构：Encoder 理解输入，Decoder 结合上下文逐步生成输出</text>

  <rect x="50" y="145" width="1300" height="700" rx="26" fill="#ffffff" opacity="0.84" stroke="#dbe5ef"/>

  <!-- Source input -->
  <rect x="90" y="210" width="250" height="165" class="card" fill="url(#embed)"/>
  <text x="215" y="250" class="section center">输入序列</text>
  <text x="215" y="286" class="text center">Source Tokens</text>
  <text x="215" y="316" class="text center">Token Embedding</text>
  <text x="215" y="346" class="text center">位置编码</text>

  <!-- Target input -->
  <rect x="90" y="520" width="250" height="165" class="card" fill="url(#embed)"/>
  <text x="215" y="560" class="section center">目标序列输入</text>
  <text x="215" y="596" class="text center">Target Tokens</text>
  <text x="215" y="626" class="text center">右移一位</text>
  <text x="215" y="656" class="text center">Embedding + 位置编码</text>

  <!-- Encoder -->
  <rect x="395" y="180" width="380" height="420" class="card" fill="url(#encoder)"/>
  <text x="585" y="224" class="section center">Encoder Stack x N</text>
  <text x="585" y="254" class="text center">提取输入序列的上下文表示</text>

  <rect x="435" y="286" width="300" height="62" class="block" fill="#ffffff"/>
  <text x="585" y="314" class="box-title center">多头自注意力</text>
  <text x="585" y="336" class="small center">Multi-Head Self-Attention</text>

  <rect x="435" y="368" width="300" height="54" class="block" fill="#ffffff"/>
  <text x="585" y="402" class="box-title center">残差连接 + LayerNorm</text>

  <rect x="435" y="442" width="300" height="62" class="block" fill="#ffffff"/>
  <text x="585" y="470" class="box-title center">前馈网络</text>
  <text x="585" y="492" class="small center">Feed Forward Network</text>

  <rect x="435" y="524" width="300" height="42" class="block" fill="#ffffff"/>
  <text x="585" y="551" class="small center">每层包含残差连接与归一化</text>

  <!-- Decoder -->
  <rect x="840" y="180" width="410" height="515" class="card" fill="url(#decoder)"/>
  <text x="1045" y="224" class="section center">Decoder Stack x N</text>
  <text x="1045" y="254" class="text center">读取历史输出和 Encoder 记忆</text>
  <text x="1045" y="278" class="text center">逐步生成目标序列</text>

  <rect x="875" y="306" width="340" height="58" class="block" fill="#ffffff"/>
  <text x="1045" y="331" class="box-title center">带掩码自注意力</text>
  <text x="1045" y="352" class="small center">Masked Self-Attention</text>

  <rect x="875" y="382" width="340" height="48" class="block" fill="#ffffff"/>
  <text x="1045" y="412" class="box-title center">残差连接 + LayerNorm</text>

  <rect x="875" y="448" width="340" height="58" class="block" fill="#ffffff"/>
  <text x="1045" y="473" class="box-title center">交叉注意力</text>
  <text x="1045" y="494" class="small center">Attention over Encoder output</text>

  <rect x="875" y="524" width="340" height="48" class="block" fill="#ffffff"/>
  <text x="1045" y="554" class="box-title center">残差连接 + LayerNorm</text>

  <rect x="875" y="590" width="340" height="58" class="block" fill="#ffffff"/>
  <text x="1045" y="615" class="box-title center">前馈网络</text>
  <text x="1045" y="636" class="small center">Feed Forward Network</text>

  <!-- Output -->
  <rect x="965" y="735" width="280" height="78" class="card" fill="url(#output)"/>
  <text x="1105" y="768" class="box-title center">Linear + Softmax</text>
  <text x="1105" y="793" class="text center">下一个 Token 概率</text>

  <!-- Attention detail -->
  <rect x="90" y="735" width="770" height="78" rx="16" fill="#f8fafc" stroke="#d5dee9"/>
  <text x="120" y="766" class="code">Scaled Dot-Product Attention: softmax(QK^T / sqrt(d_k))V</text>
  <text x="120" y="792" class="small">多头机制会并行关注不同位置与语义关系，再合并为上下文表示。</text>

  <!-- Notes -->
  <rect x="840" y="710" width="410" height="1" fill="#e7d2b5"/>
  <text x="875" y="718" class="small">Mask：防止 Decoder 看到未来 Token</text>

  <!-- Flow arrows -->
  <path d="M 340 292 C 365 292, 370 292, 392 292" class="line"/>
  <path d="M 775 394 C 805 394, 810 477, 837 477" class="dashed"/>
  <path d="M 340 602 C 540 602, 715 335, 837 335" class="line"/>
  <path d="M 1045 695 C 1045 715, 1085 715, 1105 733" class="line"/>

  <!-- Residual hints -->
  <path d="M 585 348 C 615 356, 615 366, 585 368" class="dashed"/>
  <path d="M 585 504 C 615 512, 615 520, 585 524" class="dashed"/>
  <path d="M 1045 364 C 1075 372, 1075 380, 1045 382" class="dashed"/>
  <path d="M 1045 506 C 1075 514, 1075 522, 1045 524" class="dashed"/>

  <text x="358" y="272" class="label">嵌入向量</text>
  <text x="790" y="454" class="label">K / V</text>
  <text x="545" y="620" class="label">已生成内容</text>
  <text x="1070" y="724" class="label">隐藏状态</text>
</svg>
