<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="820" viewBox="0 0 1300 820" role="img" aria-labelledby="title desc">
  <title id="title">PyTorch 架构图</title>
  <desc id="desc">展示 PyTorch 从数据加载、Tensor、nn.Module、前向传播、Loss、Autograd、Optimizer 到模型保存的训练闭环。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fffaf5"/>
      <stop offset="100%" stop-color="#f4f8ff"/>
    </linearGradient>
    <linearGradient id="core" x1="0" x2="1">
      <stop offset="0%" stop-color="#fff0e6"/>
      <stop offset="100%" stop-color="#ffd9bd"/>
    </linearGradient>
    <linearGradient id="train" x1="0" x2="1">
      <stop offset="0%" stop-color="#eefdf5"/>
      <stop offset="100%" stop-color="#d9f8e7"/>
    </linearGradient>
    <linearGradient id="deploy" x1="0" x2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#dfe7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 40px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .sub { font: 400 18px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #475569; }
      .section { font: 700 24px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .box-title { font: 700 19px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #172033; }
      .text { font: 400 15px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #43536a; }
      .code { font: 600 14px "SFMono-Regular", Consolas, monospace; fill: #b45309; }
      .card { stroke: #d5dee9; stroke-width: 1.4; rx: 16; filter: url(#shadow); }
      .small { stroke: #d5dee9; stroke-width: 1.2; rx: 12; }
      .line { fill: none; stroke: #475569; stroke-width: 2.2; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #64748b; stroke-width: 2.2; stroke-dasharray: 7 7; marker-end: url(#arrow); }
      .label { font: 600 13px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="1300" height="820" fill="url(#bg)"/>
  <text x="64" y="72" class="title">PyTorch 架构图</text>
  <text x="64" y="108" class="sub">围绕 Tensor、Autograd 和 nn.Module 构建灵活的模型训练闭环</text>
  <rect x="50" y="140" width="1200" height="610" rx="26" fill="#ffffff" opacity="0.84" stroke="#dbe5ef"/>

  <rect x="92" y="190" width="255" height="160" class="card" fill="#f8fafc"/>
  <text x="122" y="232" class="section">数据管道</text>
  <text x="122" y="268" class="text">Dataset / DataLoader</text>
  <text x="122" y="296" class="text">batch、shuffle、transform</text>
  <text x="122" y="324" class="text">NumPy 与 Tensor 互操作</text>

  <rect x="430" y="170" width="440" height="210" class="card" fill="url(#core)"/>
  <text x="462" y="214" class="section">核心运行时</text>
  <text x="462" y="250" class="text">Tensor 是主要数据结构，可在 CPU/GPU 上计算</text>
  <rect x="462" y="278" width="170" height="66" class="small" fill="#ffffff"/>
  <text x="488" y="307" class="box-title">Tensor</text>
  <text x="488" y="331" class="text">数值计算与设备管理</text>
  <rect x="665" y="278" width="170" height="66" class="small" fill="#ffffff"/>
  <text x="690" y="307" class="box-title">Autograd</text>
  <text x="690" y="331" class="text">动态计算图与梯度</text>

  <rect x="955" y="190" width="255" height="160" class="card" fill="url(#deploy)"/>
  <text x="985" y="232" class="section">模型定义</text>
  <text x="985" y="268" class="text">nn.Module 组织网络层</text>
  <text x="985" y="296" class="text">forward() 定义前向传播</text>
  <text x="985" y="324" class="text">CNN、RNN、Transformer</text>

  <rect x="92" y="455" width="1118" height="185" class="card" fill="url(#train)"/>
  <text x="122" y="498" class="section">训练循环</text>
  <text x="122" y="532" class="text">PyTorch 的训练过程通常显式编写，便于调试、研究和灵活定制。</text>

  <rect x="135" y="560" width="135" height="56" class="small" fill="#ffffff"/>
  <text x="166" y="595" class="box-title">Forward</text>
  <rect x="320" y="560" width="135" height="56" class="small" fill="#ffffff"/>
  <text x="359" y="595" class="box-title">Loss</text>
  <rect x="505" y="560" width="135" height="56" class="small" fill="#ffffff"/>
  <text x="536" y="595" class="box-title">Backward</text>
  <rect x="690" y="560" width="135" height="56" class="small" fill="#ffffff"/>
  <text x="716" y="595" class="box-title">Optimizer</text>
  <rect x="875" y="560" width="250" height="56" class="small" fill="#ffffff"/>
  <text x="922" y="595" class="box-title">Save / Load Checkpoint</text>

  <path d="M 347 270 C 378 270, 398 270, 426 270" class="line"/>
  <path d="M 870 270 C 900 270, 925 270, 950 270" class="line"/>
  <path d="M 1083 350 C 1083 410, 245 410, 204 558" class="line"/>
  <path d="M 270 588 C 288 588, 300 588, 318 588" class="line"/>
  <path d="M 455 588 C 473 588, 485 588, 503 588" class="line"/>
  <path d="M 640 588 C 658 588, 670 588, 688 588" class="line"/>
  <path d="M 825 588 C 843 588, 855 588, 873 588" class="line"/>
  <path d="M 757 560 C 757 515, 574 500, 574 560" class="loop"/>
  <path d="M 574 560 C 548 490, 735 445, 750 345" class="loop"/>
  <text x="370" y="250" class="label">批量数据</text>
  <text x="892" y="250" class="label">传入模型</text>
  <text x="612" y="516" class="label">zero_grad → backward → step</text>
  <text x="610" y="438" class="label">梯度回传到参数</text>

  <rect x="92" y="674" width="1118" height="48" rx="14" fill="#fffaf0" stroke="#e7d2b5"/>
  <text x="122" y="705" class="code">适用场景：训练模型、微调模型、研究网络结构；大模型应用开发通常只需 NumPy + API 调用。</text>
</svg>
